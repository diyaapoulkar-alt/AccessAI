<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AccessAI Extension</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #F9FAFB;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      border-bottom: 1px solid #374151;
      padding-bottom: 10px;
    }
    .header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: #10B981;
    }
    .btn {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #059669;
      color: white;
    }
    .btn-primary:hover {
      background: #047857;
    }
    .btn-danger {
      background: #DC2626;
      color: white;
    }
    .btn-danger:hover {
      background: #B91C1C;
    }
    .footer-link {
      display: block;
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
      color: #9CA3AF;
      text-decoration: none;
    }
    .footer-link:hover {
      color: #10B981;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>AccessAI Meet Assistant</h2>
  </div>

  <button id="btn-toggle" class="btn btn-primary">⚡ Toggle Overlay on Page</button>
  <button id="btn-start" class="btn btn-primary">🎙 Start Live Captions</button>
  <button id="btn-stop" class="btn btn-danger">⏹ Stop & Hide Overlay</button>

  <a href="http://localhost:5178/" target="_blank" class="footer-link">Open AccessAI Platform ➔</a>

  <script src="popup.js"></script>
</body>
</html>
